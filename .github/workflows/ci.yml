name: CI

# The quality gate. Runs on every push and every pull request, because a rule
# that only runs on release is a rule nobody follows: type errors, lint
# failures, failing tests and coverage regressions all have to block the merge
# that introduced them, not the tag three weeks later.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same version the developers run; `.nvmrc` is the single source.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Coverage thresholds live in vitest.config.ts and only ever move up.
      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build
